<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniMart - Messages</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/component.css" />
  <link rel="stylesheet" href="../css/messages.css" />
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="logo">
      <a href="marketplace.html"><span class="logo-uni">Uni</span><span class="logo-mart">Mart</span></a>
    </div>
    <div class="nav-controls">
      <a href="marketplace.html" class="icon-btn">🏪 Marketplace</a>
      <a href="profile.html" class="icon-btn">👤 MyProfile</a>
    </div>
  </header>

  <main class="chat-container">
    <div class="chat-wrapper">
      
      <!-- Left Sidebar: Conversations List -->
      <aside class="conversations-sidebar">
        <div class="sidebar-header">
          <h2>Messages</h2>
        </div>
        <div class="conversation-list" id="conversationList">
          <p class="empty-state-chat">Loading conversations...</p>
        </div>
      </aside>

      <!-- Right Window: Chat View -->
      <section class="chat-window">
        <!-- Active Chat Header -->
        <div class="chat-header hidden" id="chatHeader">
          <div class="chat-user-info">
            <div class="chat-avatar-wrap">
              <img id="activeChatAvatar" src="https://via.placeholder.com/45?text=User" alt="Avatar" />
            </div>
            <div>
              <h3 id="activeChatName">Chat User</h3>
              <span class="chat-product-badge" id="activeChatProduct">Product Tag</span>
            </div>
          </div>
        </div>

        <!-- Messages Flow -->
        <div class="chat-messages" id="chatMessages">
          <div class="chat-placeholder">
            <p>Select a conversation or reach out from a listing.</p>
          </div>
        </div>

        <!-- Message Input Bar -->
        <form class="chat-input-bar hidden" id="chatForm">
          <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" required />
          <button type="submit" class="btn-send">Send</button>
        </form>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/messages.js"></script>
</body>
</html>
