<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>UniMart - My Inventory</title>

  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#006194" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#006194",
            "primary-container": "#007bb9",
            "primary-fixed": "#cce5ff",
            "on-primary-fixed-variant": "#004b73",
            "on-primary": "#ffffff",
            secondary: "#00668a",
            "secondary-fixed": "#c4e7ff",
            "on-secondary-fixed": "#001e2c",
            tertiary: "#b61722",
            "tertiary-fixed": "#ffdad7",
            surface: "#f9f9ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f1f3ff",
            "surface-container": "#e9edff",
            "surface-container-high": "#e1e8fd",
            "on-surface": "#141b2b",
            "on-surface-variant": "#3f4850",
            outline: "#707881",
            "outline-variant": "#bfc7d2",
            "inverse-surface": "#293040",
            "inverse-on-surface": "#edf0ff",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a"
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/component.css" />
</head>

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col">

  <!-- Desktop Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/95 backdrop-blur-xl border-b border-surface-container shadow-[0_1px_8px_rgba(0,97,148,0.05)] pt-safe">
    <div class="h-16 max-w-[1500px] w-full mx-auto px-4 md:px-8 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 shrink-0">
        <a href="home.html" class="flex items-center gap-2">
          <span class="text-2xl font-bold tracking-tight text-primary">Uni<span class="text-on-surface">Mart</span></span>
        </a>
      </div>

      <nav class="hidden md:flex items-center gap-6">
        <a href="home.html" class="py-5 text-on-surface-variant hover:text-primary transition-colors text-sm font-medium">Home</a>
        <a href="marketplace.html" class="py-5 text-on-surface-variant hover:text-primary transition-colors text-sm font-medium">Marketplace</a>
        <a href="upload.html" class="py-5 text-on-surface-variant hover:text-primary transition-colors text-sm font-medium">Sell an Item</a>
        <a href="mylisting.html" class="py-5 font-semibold text-primary border-b-2 border-primary text-sm">Inventory</a>
      </nav>

      <div class="flex items-center gap-2 sm:gap-4 shrink-0">
        <a href="profile.html" class="flex items-center gap-2 p-1 rounded-full hover:bg-surface-container transition-colors">
          <div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant/60 bg-surface-container flex items-center justify-center">
            <img id="navUserAvatar" alt="Profile" class="w-full h-full object-cover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23707881'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" />
          </div>
        </a>
        <button id="logoutBtn" class="w-9 h-9 flex items-center justify-center rounded-lg text-tertiary hover:bg-tertiary-fixed/30 transition-colors" title="Log out" type="button">
          <span class="material-symbols-outlined text-xl">logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="w-full pt-20 pb-28 md:pb-16 flex-grow">
    <div class="max-w-[1500px] w-full mx-auto px-4 md:px-8 py-4 flex flex-col gap-6">

      <!-- Header & Action Row -->
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 pb-4 border-b border-surface-container">
        <div>
          <span class="text-[11px] uppercase tracking-wider font-semibold text-primary px-2.5 py-0.5 rounded-full bg-primary-fixed">Seller Hub</span>
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-on-surface mt-1.5">My Inventory & Listings</h1>
          <p class="text-xs sm:text-sm text-on-surface-variant">Manage, edit, relist, or delete items you posted on campus.</p>
        </div>
        <a href="upload.html" class="h-10 px-5 rounded-xl bg-primary hover:bg-primary-container text-on-primary text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 shadow-sm transition-colors self-start sm:self-auto">
          <span class="material-symbols-outlined text-base">add</span>
          <span>Post New Item</span>
        </a>
      </div>

      <!-- Inventory Grid -->
      <div id="sellerListingsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 w-full">
        <p class="col-span-full text-center py-20 text-sm text-outline">Loading your items...</p>
      </div>

    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-surface-container-lowest/95 backdrop-blur-xl border-t border-surface-container shadow-[0_-2px_12px_rgba(0,102,138,0.08)] pb-safe">
    <div class="flex items-center justify-around h-16 px-2">
      <a href="home.html" class="flex flex-col items-center justify-center gap-1 min-w-[50px] text-on-surface-variant hover:text-primary">
        <span class="material-symbols-outlined text-[22px]">home</span>
        <span class="text-[11px]">Home</span>
      </a>
      <a href="marketplace.html" class="flex flex-col items-center justify-center gap-1 min-w-[50px] text-on-surface-variant hover:text-primary">
        <span class="material-symbols-outlined text-[22px]">storefront</span>
        <span class="text-[11px]">Market</span>
      </a>
      <a href="upload.html" class="flex flex-col items-center justify-center gap-1 min-w-[50px] text-on-surface-variant hover:text-primary">
        <span class="material-symbols-outlined text-[22px]">add_circle</span>
        <span class="text-[11px]">Sell</span>
      </a>
      <a href="mylisting.html" class="mobile-nav-item active flex flex-col items-center justify-center gap-1 min-w-[50px] text-primary font-semibold">
        <span class="material-symbols-outlined text-[22px]">inventory_2</span>
        <span class="text-[11px]">Inventory</span>
      </a>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/mylisting.js"></script>
</body>
</html>
