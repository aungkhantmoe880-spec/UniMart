<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniMart - My Favorites</title>
  <link rel="stylesheet" href="../css/global.css" />

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="logo">
      <a href="marketplace.html"><span class="logo-uni">Uni</span><span class="logo-mart">Mart</span></a>
    </div>
    <div class="nav-actions">
      <a href="marketplace.html" class="nav-pill-btn">🏪 Marketplace</a>
      <a href="profile.html" class="nav-pill-btn nav-pill-outline">👤 MyProfile</a>
